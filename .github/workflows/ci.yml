name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A push to a PR's branch should cancel the previous run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Type-check / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Match the Node version Vite 8 + lightweight-charts target.
          # 22 is current LTS as of 2026.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # `npm run build` already runs `tsc -b` first, but we want a
        # standalone signal so a type error doesn't get blamed on the
        # build step.
        run: npm run type-check

      - name: Test
        # `npm test` defaults to watch mode (vitest), so use --run for CI.
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Bundle size budget
        # Catches accidental regressions where a heavy import sneaks
        # into the entry chunk. Budgets are intentionally generous —
        # this is meant to catch 10-15% bloats, not micro-optimize.
        run: npm run check:budget

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          # Short retention — these are debug-only, the real build is
          # whatever ships from a tagged release later.
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # E2E only runs on push to main — skipped on PRs to keep PR cycles
    # snappy. Devs can run `npm run test:e2e` locally for confidence.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: ci

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium only)
        # We pin chromium-only to keep the install footprint small; the
        # baseline tests don't need cross-browser coverage yet.
        run: npx playwright install --with-deps chromium

      - name: Build (E2E runs against the production preview)
        run: npm run build

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
